# Full deployment pipeline: runs on every push to main.
#
#   checks ──┬── web       → Firebase Hosting (live)
#            ├── android   → release APK + AAB attached to a GitHub Release
#            └── supabase  → Edge Functions (+ DB migrations when enabled)
#
# Required secrets
#   FIREBASE_SERVICE_ACCOUNT_PASSON_RIDE_RENTAL_888  (already configured)
#   SUPABASE_ACCESS_TOKEN                            (supabase.com → Account → Access Tokens)
# Optional secrets (passed to the app as --dart-define only when set)
#   RAZORPAY_KEY_ID, STREAM_API_KEY, SENTRY_DSN (public values only)
# Optional secrets / variables for Supabase
#   SUPABASE_DB_PASSWORD   secret, needed only for migrations
#   SUPABASE_PROJECT_REF   variable, defaults to gxqlsogewjjkcdetubuv
#   SUPABASE_DB_PUSH       variable, set to "true" to also apply migrations

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'gxqlsogewjjkcdetubuv' }}

jobs:
  checks:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test

  web:
    name: Deploy web (Firebase Hosting)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Write dart defines
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: .github/scripts/write_dart_defines.sh > dart_defines.json
      - run: flutter build web --release --dart-define-from-file=dart_defines.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PASSON_RIDE_RENTAL_888 }}
          channelId: live
          projectId: passon-ride-rental-888

  android:
    name: Build Android release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Write dart defines
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: .github/scripts/write_dart_defines.sh > dart_defines.json
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to ship a debug-signed release"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
      - name: Build APK & App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define-from-file=dart_defines.json
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define-from-file=dart_defines.json
          cp build/app/outputs/flutter-apk/app-release.apk passon-ride-${{ github.run_number }}.apk
          cp build/app/outputs/bundle/release/app-release.aab passon-ride-${{ github.run_number }}.aab
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PassonRide build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            passon-ride-${{ github.run_number }}.apk
            passon-ride-${{ github.run_number }}.aab

  supabase:
    name: Deploy Supabase
    needs: checks
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set, skipping Supabase deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.ok == 'true'
        with:
          version: latest
      - name: Deploy Edge Functions
        if: steps.creds.outputs.ok == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Apply database migrations
        if: steps.creds.outputs.ok == 'true' && vars.SUPABASE_DB_PUSH == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
