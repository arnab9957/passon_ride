<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PassonRide P2P Bike & Car Rental Marketplace">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="passon_ride">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PassonRide - P2P Rental & Tour Marketplace</title>
  <link rel="manifest" href="manifest.json">
  <!-- Razorpay Standard Web Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <div id="recaptcha-container"></div>
  <script>
    window.flutterWebRenderer = "html";

    function openRazorpayCheckout(key, amount, name, description, contact, email, successCallback, errorCallback) {
      var options = {
        key: key,
        amount: amount,
        currency: 'INR',
        name: name,
        description: description,
        prefill: {
          contact: contact,
          email: email
        },
        handler: function (response) {
          if (successCallback) {
            successCallback(response.razorpay_payment_id || '', response.razorpay_order_id || '', response.razorpay_signature || '');
          }
        },
        modal: {
          ondismiss: function () {
            if (errorCallback) {
              errorCallback('User Cancelled Payment');
            }
          }
        }
      };
      try {
        var rzp = new Razorpay(options);
        rzp.on('payment.failed', function (resp) {
          if (errorCallback) {
            errorCallback(resp.error ? resp.error.description : 'Payment Failed');
          }
        });
        rzp.open();
      } catch (err) {
        console.error('Razorpay JS error:', err);
        if (errorCallback) {
          errorCallback(err.toString());
        }
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
