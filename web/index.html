<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PassionRide P2P Bike & Car Rental Marketplace">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="passon_ride">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/jpg" href="logo.jpg" />

  <title>PassionRide</title>
  <link rel="manifest" href="manifest.json">

  <!-- Suppress Chrome font & asset preload warnings -->
  <script>
    (function () {
      const observer = new MutationObserver(function (mutations) {
        for (let i = 0; i < mutations.length; i++) {
          const added = mutations[i].addedNodes;
          for (let j = 0; j < added.length; j++) {
            const node = added[j];
            if (node.nodeType === 1 && node.tagName === 'LINK' && node.getAttribute('rel') === 'preload') {
              node.setAttribute('rel', 'prefetch');
            }
          }
        }
      });
      observer.observe(document.head || document.documentElement, { childList: true, subtree: true });
    })();
  </script>

  <!-- Razorpay Standard Web Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>
  <div id="recaptcha-container"></div>
  <script>
    window.flutterWebRenderer = "html";

    function openRazorpayCheckout(key, orderId, amount, name, description, contact, email, notesJson, successCallback, errorCallback) {
      var parsedNotes = {};
      try {
        if (notesJson && typeof notesJson === 'string' && notesJson.trim() !== '') {
          parsedNotes = JSON.parse(notesJson);
        } else if (notesJson && typeof notesJson === 'object') {
          parsedNotes = notesJson;
        }
      } catch (e) {
        console.warn('Could not parse notes JSON:', e);
      }

      var options = {
        key: key || 'rzp_test_TQuIDr91hSpnrx',
        amount: amount,
        currency: 'INR',
        name: name || 'Passon Ride Escrow',
        description: description || 'Vehicle Rental Escrow',
        image: 'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=200&q=80',
        prefill: {
          name: name || 'Passon Rider',
          contact: contact || '+919876543210',
          email: email || 'rider@passonride.com'
        },
        notes: parsedNotes,
        theme: {
          color: '#0284C7',
          backdrop_color: 'rgba(15, 23, 42, 0.7)'
        },
        modal: {
          escape: true,
          backdropclose: false,
          confirm_close: true,
          ondismiss: function () {
            if (errorCallback) {
              errorCallback('Payment Cancelled by User');
            }
          }
        },
        retry: {
          enabled: true
        },
        handler: function (response) {
          if (successCallback) {
            var payId = response.razorpay_payment_id || ('pay_web_' + Date.now());
            var ordId = response.razorpay_order_id || orderId || '';
            var sig = response.razorpay_signature || '';
            successCallback(payId, ordId, sig);
          }
        }
      };

      // Set order_id if it's a real order id from Razorpay API
      if (orderId && typeof orderId === 'string' && orderId.startsWith('order_') && !orderId.startsWith('order_fallback_') && !orderId.startsWith('order_test_') && !orderId.startsWith('order_web_')) {
        options.order_id = orderId;
      }

      try {
        if (typeof Razorpay === 'undefined') {
          throw new Error('Razorpay SDK not loaded. Please check your internet connection.');
        }
        var rzp = new Razorpay(options);
        rzp.on('payment.failed', function (resp) {
          console.error('Razorpay payment failed:', resp);
          if (errorCallback) {
            var desc = (resp && resp.error && resp.error.description) ? resp.error.description : 'Payment Failed';
            errorCallback(desc);
          }
        });
        rzp.open();
      } catch (err) {
        console.error('Razorpay JS error:', err);
        if (errorCallback) {
          errorCallback(err.message || err.toString());
        }
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
